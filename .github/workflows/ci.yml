name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHELLCHECK_VERSION: v0.11.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned like shfmt: the apt package moves with the runner image, so an
      # image refresh could turn CI red with no change in the repository.
      - name: Install ShellCheck
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Run ShellCheck
        run: |
          shellcheck gos.sh install.sh completions/gos.bash scripts/*.bash scripts/*.sh tests/*.bash

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHFMT_VERSION: v3.13.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install shfmt
        run: |
          curl -fsSL -o /tmp/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      - name: Run shfmt
        run: |
          shfmt -d -i 2 -ci -bn .

  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install completion shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish

      # Every tracked shell file, derived from git so a new script can never be
      # left out of the syntax gate (validate-local keeps the explicit list and an
      # invariant asserts the two agree).
      - name: Bash syntax
        run: |
          git ls-files -z '*.sh' '*.bash' | xargs -0 bash -n --

      - name: Command surface sync
        run: |
          bash scripts/sync-command-surfaces.bash --check

      # The feature suite has isolated jq-only and python3-only branches. Make
      # both parsers hard CI dependencies instead of silently shrinking the
      # matrix if a hosted-runner image changes.
      - name: Require feed parser matrix dependencies
        if: runner.os != 'Windows'
        run: |
          command -v jq
          jq --version
          command -v python3
          python3 --version

      # `shell: bash` resolves to Homebrew's bash 5 on the macOS image, so the
      # bash 3.2 floor gos promises (stock macOS) would otherwise only ever be
      # exercised on contributors' Macs. Put the system bash first on PATH so
      # the suites, and the gos.sh they spawn, run under 3.2.
      - name: Bash 3.2 compatibility
        if: runner.os == 'macOS'
        run: |
          mkdir -p "${RUNNER_TEMP}/bash32"
          ln -s /bin/bash "${RUNNER_TEMP}/bash32/bash"
          export PATH="${RUNNER_TEMP}/bash32:${PATH}"
          bash --version | head -n 1 | grep -F 'version 3.2'
          bash scripts/run-tests.bash --jobs 2 unit-versions cli-readonly install-cache side-by-side install-transaction checksum

      - name: PowerShell syntax
        if: runner.os == 'Windows'
        run: |
          # shellcheck disable=SC2016 # PowerShell, not Bash, expands these variables.
          powershell -NoProfile -ExecutionPolicy Bypass -Command '$files = @("install.ps1", "packaging/chocolatey/tools/chocolateyInstall.ps1", "packaging/chocolatey/tools/chocolateyUninstall.ps1", "packaging/windows/uninstall.ps1", "tests/install-ps1.ps1"); foreach ($file in $files) { $errors = $null; $tokens = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | Format-List; exit 1 } }'

      # Static analysis of the PowerShell files beyond the AST parse above;
      # Error severity only, so style rules cannot turn the job red.
      - name: PSScriptAnalyzer
        if: runner.os == 'Windows'
        run: |
          # shellcheck disable=SC2016 # PowerShell, not Bash, expands these variables.
          powershell -NoProfile -ExecutionPolicy Bypass -Command '$files = @("install.ps1", "packaging/chocolatey/tools/chocolateyInstall.ps1", "packaging/chocolatey/tools/chocolateyUninstall.ps1", "packaging/windows/uninstall.ps1", "tests/install-ps1.ps1"); Import-Module PSScriptAnalyzer -ErrorAction Stop; $findings = Invoke-ScriptAnalyzer -Path $files -Severity Error; if ($findings) { $findings | Format-List; exit 1 }'

      - name: PowerShell installer functional test
        if: runner.os == 'Windows'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/install-ps1.ps1

      # Every tracked tests/*.bash suite; each suite's own "# gos-suite:" header
      # says where it can run, so a new suite needs no workflow change.
      - name: Run test suites
        run: |
          bash scripts/run-tests.bash --jobs 2

      - name: Smoke gos commands
        run: |
          ./gos.sh version
          ./gos.sh help

      - name: Zsh completion syntax
        if: runner.os != 'Windows'
        run: |
          zsh -n completions/gos.zsh

      - name: Fish completion syntax
        if: runner.os == 'Linux'
        run: |
          fish --no-config --no-execute completions/gos.fish

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned like shfmt and ShellCheck; actionlint checks expression and
      # shell mistakes in the workflows that tests/workflows.bash's semantic
      # invariants do not cover.
      - name: Install actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Run actionlint
        run: |
          actionlint

  workflow-validation:
    name: Workflow Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate workflow YAML and invariants
        run: |
          bash tests/workflows.bash

      # validate-local runs this against the working tree; a clean checkout has
      # no diff, so compare every tracked file against the empty tree instead.
      - name: Whitespace and conflict markers
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
