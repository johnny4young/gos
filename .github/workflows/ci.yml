name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHELLCHECK_VERSION: v0.11.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned like shfmt: the apt package moves with the runner image, so an
      # image refresh could turn CI red with no change in the repository.
      - name: Install ShellCheck
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Run ShellCheck
        run: |
          shellcheck gos.sh install.sh completions/gos.bash scripts/*.bash scripts/*.sh tests/*.bash

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHFMT_VERSION: v3.13.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install shfmt
        run: |
          curl -fsSL -o /tmp/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      - name: Run shfmt
        run: |
          shfmt -d -i 2 -ci -bn .

  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install completion shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish

      # Every tracked shell file, derived from git so a new script can never be
      # left out of the syntax gate (validate-local keeps the explicit list and an
      # invariant asserts the two agree).
      - name: Bash syntax
        run: |
          bash -n $(git ls-files '*.sh' '*.bash')

      - name: Command surface sync
        run: |
          bash scripts/sync-command-surfaces.bash --check

      # `shell: bash` resolves to Homebrew's bash 5 on the macOS image, so the
      # bash 3.2 floor gos promises (stock macOS) would otherwise only ever be
      # exercised on contributors' Macs. Put the system bash first on PATH so
      # the suites, and the gos.sh they spawn, run under 3.2.
      - name: Bash 3.2 compatibility
        if: runner.os == 'macOS'
        run: |
          mkdir -p "${RUNNER_TEMP}/bash32"
          ln -s /bin/bash "${RUNNER_TEMP}/bash32/bash"
          export PATH="${RUNNER_TEMP}/bash32:${PATH}"
          bash --version | head -n 1 | grep -F 'version 3.2'
          bash tests/features.bash
          bash tests/install-transaction.bash
          bash tests/checksum.bash

      - name: PowerShell syntax
        if: runner.os == 'Windows'
        run: |
          # shellcheck disable=SC2016 # PowerShell, not Bash, expands these variables.
          powershell -NoProfile -ExecutionPolicy Bypass -Command '$files = @("install.ps1", "packaging/chocolatey/tools/chocolateyInstall.ps1", "packaging/chocolatey/tools/chocolateyUninstall.ps1", "packaging/windows/uninstall.ps1", "tests/install-ps1.ps1"); foreach ($file in $files) { $errors = $null; $tokens = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null; if ($errors.Count) { $errors | Format-List; exit 1 } }'

      - name: PowerShell installer functional test
        if: runner.os == 'Windows'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/install-ps1.ps1

      - name: Run checksum tests
        run: |
          bash tests/checksum.bash

      - name: Run completion tests
        run: |
          bash tests/completions.bash

      - name: Run transactional install tests
        run: |
          bash tests/install-transaction.bash

      - name: Run installer tests
        run: |
          bash tests/install-sh.bash

      - name: Run PowerShell installer tests
        run: |
          bash tests/install-ps1.bash

      - name: Run packaging automation tests
        if: runner.os == 'Linux'
        run: |
          bash tests/packaging.bash

      - name: Run Homebrew tap automation tests
        if: runner.os == 'Linux'
        run: |
          bash tests/homebrew-tap.bash

      - name: Run changelog automation tests
        run: |
          bash tests/changelog.bash

      - name: Run feature tests
        # The feature suite drives Unix-only behaviour (pseudo-terminals via
        # termios, mtime and mode probes, executable fake bins). Windows-facing
        # paths are covered by the extraction, installer, and completion suites.
        if: runner.os != 'Windows'
        run: |
          bash tests/features.bash

      - name: Run platform detection tests
        run: |
          bash tests/detection.bash

      - name: Run Windows extraction tests
        run: |
          bash tests/windows-extract.bash

      - name: Smoke gos commands
        run: |
          ./gos.sh version
          ./gos.sh help

      - name: Zsh completion syntax
        if: runner.os != 'Windows'
        run: |
          zsh -n completions/gos.zsh

      - name: Fish completion syntax
        if: runner.os == 'Linux'
        run: |
          fish --no-config --no-execute completions/gos.fish

  workflow-validation:
    name: Workflow Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate workflow YAML and invariants
        run: |
          bash tests/workflows.bash

      # validate-local runs this against the working tree; a clean checkout has
      # no diff, so compare every tracked file against the empty tree instead.
      - name: Whitespace and conflict markers
        run: |
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
