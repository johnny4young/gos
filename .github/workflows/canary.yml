name: Canary

# The test suite is hermetic by design (fake curl, fake feed), which means
# drift in the real go.dev feed format or download endpoints would otherwise
# be discovered by users first. This nightly job exercises gos against the
# live feed on every supported OS.

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# The issue reporter uses a list-then-create upsert. Keep only one canary run
# active at a time so scheduled and manually dispatched runs cannot both create
# the same per-OS tracking issue.
concurrency:
  group: canary-live-feed
  cancel-in-progress: false

jobs:
  live-feed:
    name: Live feed (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Live checks have shorter step deadlines so a hung command fails while the
    # issue-reporting step can still run. This remains an outer safety bound.
    timeout-minutes: 45
    # issues: write only so a failed run can open or update a tracking issue;
    # without it a scheduled failure reaches nobody but the last committer's
    # inbox, and a canary nobody sees fail is no canary at all.
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Make script executable
        run: chmod +x gos.sh

      - name: Query the live feed
        timeout-minutes: 5
        run: |
          ./gos.sh check
          ./gos.sh list | tail -n 5
          ./gos.sh platforms

      - name: Install a pinned older Go with mandatory verification
        timeout-minutes: 10
        env:
          GOS_REQUIRE_CHECKSUM: feed
        run: |
          export GOS_INSTALL_DIR="$HOME/canary-go"
          ./gos.sh install 1.24.0
          "$GOS_INSTALL_DIR/bin/go" version | grep -F 'go1.24.0'

      - name: Upgrade to latest and roll back
        timeout-minutes: 10
        env:
          GOS_REQUIRE_CHECKSUM: feed
        run: |
          export GOS_INSTALL_DIR="$HOME/canary-go"
          ./gos.sh latest
          "$GOS_INSTALL_DIR/bin/go" version
          ./gos.sh rollback
          "$GOS_INSTALL_DIR/bin/go" version | grep -F 'go1.24.0'

      - name: Side-by-side mode against the live feed
        if: runner.os != 'Windows'
        timeout-minutes: 10
        env:
          GOS_REQUIRE_CHECKSUM: feed
        run: |
          export GOS_INSTALL_DIR="$HOME/canary-sbs/go"
          export GOS_VERSIONS_DIR="$HOME/canary-sbs/versions"
          ./gos.sh install 1.24.0
          ./gos.sh latest
          ./gos.sh install 1.24.0   # instant switch, no download
          ./gos.sh list --installed
          "$GOS_INSTALL_DIR/bin/go" version | grep -F 'go1.24.0'

      - name: Open or update the tracking issue
        if: failure()
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OS_NAME: ${{ matrix.os }}
        run: |
          title="Canary failed on ${OS_NAME}"
          gh label create canary --description "Nightly live-feed canary failures" --color B60205 --force
          existing="$(gh issue list --label canary --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: ${RUN_URL}"
          else
            gh issue create --title "$title" --label canary --body "The nightly canary against the live go.dev feed failed on ${OS_NAME}: ${RUN_URL}"
          fi
