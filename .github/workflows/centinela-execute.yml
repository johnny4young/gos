name: Centinela Execute (Opt-in Tier 2)

# Calls the centralized Tier 2 reusable workflow for `/centinela draft-pr` (`centinela: draft-pr`
# label) on issues and `/centinela fix-nits` on pull requests. Strictly separate from Tier 1.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  execute:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: johnny4young/centinela/.github/workflows/reusable-centinela-execute.yml@94d61e6d2645f1bcc768d9a864452c093223d8a5 # v1.11.2
    with:
      runs-on: ubuntu-latest
    secrets: inherit
