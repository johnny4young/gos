name: Scorecard

# OpenSSF Scorecard supply-chain analysis. Results are published to the public
# Scorecard API (for the README badge) and uploaded to the repository's code
# scanning dashboard.

on:
  schedule:
    # Weekly, staggered off the top of the hour.
    - cron: "27 7 * * 1"
  push:
    branches:
      - main

# Least privilege by default; the analysis job widens only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Checkout and Scorecard need repository contents, while every other
      # read scope remains disabled by the job-level override.
      contents: read
      # Upload the SARIF results to the code scanning dashboard.
      security-events: write
      # Publish results to the OpenSSF API via keyless (OIDC) signing.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: results.sarif
